[package]
name = "dcgaimodel"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["S-idd"]
description = "Advisory machine-learning models for Data Contract Governance risk analysis"
repository = "https://github.com/S-idd/dcgaimodel"
readme = "README.md"
license = "Apache-2.0"
keywords = ["data-contracts", "governance", "machine-learning", "schema", "rust"]
categories = ["algorithms", "science"]

[dependencies]
axum = "0.8"
jsonschema = { version = "0.53", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parquet = "57"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[package.metadata.docs.rs]
all-features = true
