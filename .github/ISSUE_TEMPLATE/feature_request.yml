name: Feature request
description: Propose a focused improvement to dcgaimodel.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or limitation should this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior and important tradeoffs.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety, compatibility, and provenance
      description: Note any effect on advisory boundaries, artifact formats, datasets, or reproducibility.
    validations:
      required: true
