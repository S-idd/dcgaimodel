name: Bug report
description: Report a reproducible defect in dcgaimodel.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thank you for taking the time to report a problem.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest safe example and the commands you ran.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or a commit SHA
    validations:
      required: true
  - type: input
    id: rust
    attributes:
      label: Rust version
      placeholder: Output of rustc --version
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and additional context
      description: Include the OS and sanitized logs. Never include credentials or private data.
